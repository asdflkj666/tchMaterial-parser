name: Build & Release

permissions:
  contents: write

# 只在手动触发时构建：**发布 Release 不会自动触发本工作流**。
# 本仓库的正式发布是本地编译后手动上传产物的（见 AGENTS.md「构建与发布」）；
# 这个矩阵留着，是为了需要其它平台产物时能一键补出来。
# 触发前请先确保目标 tag 已经 push 到远端，否则 checkout 会失败。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag：构建该 tag 指向的提交，并把产物挂到同名 Release 上"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.name }} App
    runs-on: ${{ matrix.os }}
    strategy:
      # 不要因为某一个平台构建失败就取消其余平台的构建
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            binary: tchMaterial-parser.exe
            asset: tchMaterial-parser-windows-x64.exe
          - name: Windows Arm64
            os: windows-11-arm
            binary: tchMaterial-parser.exe
            asset: tchMaterial-parser-windows-arm64.exe
          - name: Linux x64
            os: ubuntu-latest
            binary: tchMaterial-parser
            asset: tchMaterial-parser-linux-x64
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            binary: tchMaterial-parser
            asset: tchMaterial-parser-linux-arm64
          - name: macOS x64
            os: macos-26-intel
            binary: tchMaterial-parser.app
            asset: tchMaterial-parser-mac-x64.zip
          - name: macOS Arm64
            os: macos-latest
            binary: tchMaterial-parser.app
            asset: tchMaterial-parser-mac-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # 必须按 tag 检出：手动触发时 github.ref_name 是分支名，不指定就会构建分支当前代码，
          # 产物与挂上去的 tag 对不上
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build app with PyInstaller
        run: pyinstaller ./tchMaterial-parser.spec

      # Windows 与 Linux 构建出的是单个可执行文件，改名后直接上传
      - name: Pack app (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      # macOS 构建出的是 .app 应用包（一个目录），需用 ditto 打包为 zip 以保留资源分支与权限
      - name: Pack app (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/ditto -c -k --keepParent -rsrc "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          tag_name: ${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
